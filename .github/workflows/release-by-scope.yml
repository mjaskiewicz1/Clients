name: Release NuGet package by PR scope

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
    branches:
      - master

jobs:
  detect-scope:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Detect conventional commit scope
        id: scope
        shell: bash
        env:
          MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          echo "Message: $MESSAGE"
          if [[ "$MESSAGE" =~ ^.+\(([^)]+)\): ]]; then
            scope="${BASH_REMATCH[1]}"
          else
            scope="none"
          fi
          echo "Detected scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  release:
    needs: detect-scope
    if: github.ref == 'refs/heads/master' && needs.detect-scope.outputs.scope != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Create GitHub release and changelog
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Pack NuGet package
        if: ${{ steps.release.outputs.release_created }}
        run: dotnet pack RadioBrowser/RadioBrowser/RadioBrowser.csproj -c Release -o artifacts/nuget --nologo

      - name: Publish to NuGet
        if: ${{ steps.release.outputs.release_created }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
